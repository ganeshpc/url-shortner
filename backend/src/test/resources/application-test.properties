# Test-specific configuration for API tests
# Uses separate H2 database instance for testing

# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb_api;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Test Server Configuration
server.port=8080

# CORS Configuration for tests
app.cors.allowed-origins=http://localhost:3000,http://localhost:8081

# Application URLs for tests
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000

# Short Code Generation Configuration for tests
app.shortcode.length=7
app.shortcode.max-retry-attempts=5
app.shortcode.strategy=MIXED
app.shortcode.character-set=BASE58

# Logging configuration for tests
logging.level.com.urlshortener=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG