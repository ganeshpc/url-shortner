# Default Configuration - Dev Environment
# Set active profile for development by default
spring.profiles.active=dev

# Server Configuration
server.port=8080

# Default values (will be overridden by profile-specific configs)
# See application-dev.properties and application-prod.properties for environment-specific settings

# Short Code Generation Configuration (shared across all profiles)
app.shortcode.length=7
app.shortcode.max-retry-attempts=5
app.shortcode.strategy=MIXED
app.shortcode.character-set=BASE58
